  .board {
    position: relative;
    width: 100%;
    max-width: 1400px;
    container-type: inline-size;
    container-name: board;
  }

  .board img.bg {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    pointer-events: none;
  }

  .field {
    position: absolute;
    font-family: 'Nine by Five', 'Silkscreen', monospace;
    color: #8d7c76;
  }

  /* ---- Name input (top-left, mandatory) ---- */
  .name-field {
    left: 17.15%;
    top: 20.35%;
    width: 23.44%;
    height: 3.96%;
  }

  .name-field input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    color: #8d7c76;
    font-size: calc(100cqw * 38 / 2560);
    text-align: left;
    padding-left: calc(100cqw * 28 / 2560);
    padding-right: calc(100cqw * 10 / 2560);
  }

  .name-field input::placeholder {
    color: #d9b9c8;
    font-family: inherit;
    opacity: 1;
  }

  /* ---- Comments list (scrollable, sits right under the name box) ---- */
  .comments-field {
    left: 17.15%;
    top: 25.7%;
    width: 66.35%;
    height: 59.5%;
    overflow-y: auto;
    padding-right: calc(100cqw * 12 / 2560);
  }

  .comments-field::-webkit-scrollbar {
    width: calc(100cqw * 10 / 2560);
  }

  .comments-field::-webkit-scrollbar-track {
    background: transparent;
  }

  .comments-field::-webkit-scrollbar-thumb {
    background: #f0cddd;
    border-radius: 999px;
  }

  .comments-field {
    scrollbar-width: thin;
    scrollbar-color: #f0cddd transparent;
  }

  .comment-item {
    display: flex;
    align-items: flex-start;
    gap: calc(100cqw * 18 / 2560);
    margin-bottom: calc(100cqw * 28 / 2560);
  }

  .comment-avatar-frame {
    flex: 0 0 auto;
    width: calc(100cqw * 110 / 2560);
    height: calc(100cqw * 110 / 2560);

  const emoticonPopup = document.getElementById('emoticonPopup');

  emoticonBtn.addEventListener('click', (e) => {

    emoticonPopup.classList.toggle('open');

  document.addEventListener('click', (e) => {

  ];

  const emoticonGrid = document.querySelector('.emoticon-grid');

  emoticonGrid.innerHTML = emoticons.map(em => `
    <button type="button" class="emoticon-option" data-code="${em.code}" aria-label="Insert ${em.code}">
      <img src="${em.src}" alt="${em.code}">
    </button>
  `).join('');

  emoticonGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.emoticon-option');
    if (!btn) return;
    insertAtCursor(commentInput, btn.dataset.code);
    emoticonPopup.classList.remove('open');
    commentInput.focus();
  });

  function insertAtCursor(input, text) {
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? input.value.length;
    const before = input.value.slice(0, start);
    const after = input.value.slice(end);
    input.value = before + text + after;
    const cursorPos = start + text.length;
    input.setSelectionRange(cursorPos, cursorPos);
  }

  function renderCommentText(text) {
    const escaped = escapeHTML(text);
    const codePattern = new RegExp(emoticons.map(em => em.code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    return escaped.replace(codePattern, (match) => {
      const em = emoticons.find(e => e.code === match);
      return `<img class="inline-emoticon" src="${em.src}" alt="${em.code}">`;
    });
  }

  function renderComments() {
    commentsList.innerHTML = comments.map((c, i) => `
      <div class="comment-item">
        <div class="comment-avatar-frame"><img class="comment-avatar" src="${c.avatar}" alt=""></div>
        <div class="comment-body">
          <p class="comment-name">${escapeHTML(c.name)}</p>
          <div class="comment-bubble"><p>${renderCommentText(c.text)}</p></div>
          <div class="comment-meta">
            <button type="button" class="reply-btn" data-index="${i}">reply</button>
            <span class="comment-timestamp">${escapeHTML(c.timestamp)}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function setReplyingTo(name) {
    replyingTo = name;
    commentInput.placeholder = "replying to " + name;
    commentInput.value = "";
    commentInput.focus();
  }

  function clearReplyingTo() {
    replyingTo = null;
    commentInput.placeholder = DEFAULT_PLACEHOLDER;
  }

  commentsList.addEventListener('click', (e) => {
    const btn = e.target.closest('.reply-btn');
    if (!btn) return;
    const idx = Number(btn.dataset.index);
    setReplyingTo(comments[idx].name);
  });

  function formatTimestamp(d) {
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    if (hours === 0) hours = 12;
    return `${dd}/${mm}/${yyyy} ${hours}:${minutes} ${ampm}`;
  }

  async function loadComments() {
    const { data, error } = await db
      .from('guestbook')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Error loading comments:', error);
      return;
    }

    comments.length = 0;

    data.forEach(row => {
      comments.push({
        name: row.name,
        avatar: row.avatar || DEFAULT_AVATAR,
        text: row.comment,
        timestamp: formatTimestamp(new Date(row.created_at))
      });
    });

    renderComments();
  }

  document.getElementById('guestbookForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const commentText = commentInput.value.trim();
    if (!name || !commentText) return;

    const finalText = replyingTo ? `@${replyingTo} ${commentText}` : commentText;

    const { error } = await db
      .from('guestbook')
      .insert({
        name: name,
        comment: finalText,
        avatar: DEFAULT_AVATAR
      });

    if (error) {
      console.error('Error saving comment:', error);
      alert('Oops! Your comment could not be saved.');
      return;
    }

    clearReplyingTo();
    document.getElementById('guestbookForm').reset();
    commentInput.placeholder = DEFAULT_PLACEHOLDER;

    await loadComments();
  });

  loadComments();
</script>

</body>
</html>
